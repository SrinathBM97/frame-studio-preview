name: FRAME Unified Development Regression
on:
  push:
    branches: [develop]
    paths:
      - 'frame-unified/**'
      - '.github/workflows/frame-unified.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tesseract OCR engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
      - name: Install Python image and API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r frame-unified/requirements.txt
      - name: Run unified synthetic integration and core tests
        run: |
          cd frame-unified
          python -m pytest -q tests/test_integration.py tests/test_public_ci.py quality/test_public_synthetic.py

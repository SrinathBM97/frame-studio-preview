name: FRAME Core Research Regression
on:
  push:
    branches: [research/frame-core-v6]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r frame-core/requirements.txt
      - name: Test synthetic public fixtures
        run: |
          cd frame-core
          python -m pytest -q tests/test_public_ci.py
